<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soluciones EPP Store · Catálogo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07111b;--panel:#0e1b29;--line:#263b4d;--text:#eef5fb;--muted:#9fb2c4;--orange:#ff7500;--orange2:#ff9a2f;--green:#20b26b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at top,#16283a,#07111b 55%);color:var(--text)}
.wrap{max-width:1320px;margin:0 auto;padding:0 18px}.top{position:sticky;top:0;z-index:30;background:rgba(7,17,27,.93);border-bottom:1px solid #1f3345;backdrop-filter:blur(8px)}
.top .wrap{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand strong{display:block;font-size:24px}.brand small{color:var(--muted)}
.hero{padding:52px 0 30px}.hero h1{font-size:clamp(34px,6vw,72px);line-height:.95;margin:0;max-width:900px}.hero h1 em{font-style:normal;color:var(--orange)}.hero p{max-width:760px;color:#b7c7d4;line-height:1.6}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.search{flex:1;min-width:250px;border:1px solid #294157;background:#091723;color:#fff;border-radius:13px;padding:12px 14px}.filter{flex:0 1 250px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding-bottom:70px}.card{background:#0e1b29;border:1px solid #24394b;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,border-color .18s,box-shadow .18s}.card:hover{transform:translateY(-3px);border-color:#45627b;box-shadow:0 16px 38px rgba(0,0,0,.22)}
.ph{height:230px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 78%,rgba(255,255,255,.95),rgba(247,245,239,.82) 33%,rgba(224,230,234,.98) 100%);display:grid;place-items:center;color:#24303b;font-size:12px}.ph:after{content:'';position:absolute;left:15%;right:15%;bottom:15px;height:18px;border-radius:50%;background:rgba(36,48,59,.15);filter:blur(12px);z-index:0}.ph img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;padding:16px;filter:drop-shadow(0 9px 8px rgba(18,30,41,.15));transition:transform .24s}.card:hover .ph img{transform:scale(1.035)}
.body{padding:15px;display:flex;flex-direction:column;gap:8px;flex:1}.cat{color:#91a7b8;font-size:10px;text-transform:uppercase;letter-spacing:.07em}.name{font-weight:900;line-height:1.3}.desc{color:#c2cfda;font-size:12px;line-height:1.5}.badge{display:inline-flex;border:1px solid #38526a;background:#152739;border-radius:999px;padding:5px 8px;font-size:10px;width:max-content}
.btn{border:1px solid #2a4155;background:#142435;color:#fff;border-radius:11px;padding:10px 12px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,var(--orange),var(--orange2));border-color:#ff8b22;color:#171717}
.cartbtn{position:fixed;right:20px;bottom:20px;z-index:50;box-shadow:0 15px 40px rgba(0,0,0,.35)}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(430px,100%);z-index:80;background:#091520;border-left:1px solid #2a4155;transform:translateX(102%);transition:.22s;display:flex;flex-direction:column}.drawer.open{transform:none}
.dhead{padding:18px;border-bottom:1px solid #213647;display:flex;justify-content:space-between;align-items:center}.dcontent{padding:16px;overflow:auto;flex:1}.item{display:grid;grid-template-columns:1fr 92px 30px;gap:9px;align-items:center;border-bottom:1px solid #1f3345;padding:11px 0}.item small{color:var(--muted)}.item-detail{grid-column:1/-1;display:grid;grid-template-columns:1fr 1.5fr;gap:8px}.qty{width:100%;border:1px solid #294157;background:#07121d;color:#fff;border-radius:9px;padding:8px}.line-input{width:100%;border:1px solid #294157;background:#07121d;color:#fff;border-radius:8px;padding:8px;font:inherit;font-size:12px}.line-input.area{min-height:42px;resize:vertical}
.form{display:grid;gap:10px;margin-top:18px}.input,.area{width:100%;border:1px solid #294157;background:#07121d;color:#fff;border-radius:10px;padding:10px}.area{min-height:80px}
.empty{text-align:center;color:#91a6b8;padding:40px}.success{border:1px solid #27603f;background:#103021;color:#caffdf;border-radius:12px;padding:12px;margin-top:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.actions .btn{flex:1;min-width:128px}.modal{position:fixed;inset:0;z-index:100;background:rgba(2,8,13,.76);display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modal-box{position:relative;width:min(1080px,100%);max-height:min(820px,calc(100vh - 36px));overflow:auto;background:#091722;border:1px solid #35516a;border-radius:22px;box-shadow:0 30px 90px rgba(0,0,0,.55)}.modal-close{position:sticky;float:right;top:12px;right:12px;z-index:3;margin:12px}.detail{display:grid;grid-template-columns:minmax(320px,.9fr) minmax(340px,1.1fr);gap:28px;padding:28px}.detail-photo{min-height:420px;position:relative;display:grid;place-items:center;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 78%,#fff,#f4f1ea 45%,#dfe7eb)}.detail-photo:after{content:'';position:absolute;left:18%;right:18%;bottom:24px;height:25px;border-radius:50%;background:rgba(28,39,49,.15);filter:blur(14px)}.detail-photo img{position:relative;z-index:1;max-width:100%;max-height:420px;object-fit:contain;padding:24px;filter:drop-shadow(0 12px 10px rgba(18,30,41,.16))}.thumbs{display:flex;gap:9px;overflow:auto;padding:12px 2px}.thumb{width:70px;height:70px;flex:0 0 70px;border:2px solid transparent;border-radius:12px;background:#eff3f5;cursor:pointer;overflow:hidden}.thumb.active{border-color:var(--orange)}.thumb img{width:100%;height:100%;object-fit:contain;padding:5px}.detail h2{font-size:clamp(27px,3vw,42px);line-height:1.06;margin:8px 0}.dcat{font-size:11px;color:#9cb2c4;letter-spacing:.08em;text-transform:uppercase}.dintro{color:#d0dce4;line-height:1.62}.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:18px 0}.spec{border:1px solid #274055;background:#0d1f2d;border-radius:12px;padding:10px}.spec small{display:block;color:#91a6b8;font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}.spec b{font-size:12px;line-height:1.35}.dsect{margin-top:18px;border-top:1px solid #20384a;padding-top:16px}.dsect h3{margin:0 0 9px;font-size:14px}.features{display:grid;gap:7px}.feature{background:#102535;border:1px solid #29445a;border-radius:10px;padding:9px 10px;font-size:12px;color:#d9e5ed}.info,.warning{font-size:13px;line-height:1.55;color:#c5d2dc;white-space:pre-line}.warning{border-left:3px solid var(--orange);padding-left:11px}.technical-note{color:#9fb2c4;font-size:11px;line-height:1.45;margin-top:15px}
@media(max-width:1050px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.detail{grid-template-columns:1fr}.detail-photo{min-height:300px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.top .wrap{min-height:68px}.brand strong{font-size:19px}.detail{padding:18px}.specs{grid-template-columns:1fr}.modal{padding:8px}.modal-box{max-height:calc(100vh - 16px)}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="brand"><strong id="brand">SOLUCIONES EPP STORE</strong><small id="contact">Bogotá · 3151254046</small></div><button class="btn primary" onclick="openCart()">Carrito <span id="cartCount">0</span></button></div></header>
<main class="wrap"><section class="hero"><h1>PROTECCIÓN CONFIABLE<br><em>PARA CADA LABOR</em></h1><p>Catálogo comercial de elementos de protección personal. Selecciona las referencias que necesitas y envía una solicitud de cotización directamente a nuestro equipo.</p></section><div class="toolbar"><input id="search" class="search" placeholder="Buscar producto, marca, referencia…" oninput="renderProducts()"><select id="categoryFilter" class="search filter" onchange="renderProducts()"><option value="">Todas las categorías</option></select></div><div id="catalog" class="grid"></div></main>
<button class="btn primary cartbtn" onclick="openCart()">Solicitar cotización · <span id="cartCount2">0</span></button>
<aside id="drawer" class="drawer"><div class="dhead"><strong>Solicitud de cotización</strong><button class="btn" onclick="closeCart()">×</button></div><div class="dcontent"><div id="cartItems"></div><div id="requestForm" class="form"><input id="rName" class="input" placeholder="Nombre *"><input id="rCompany" class="input" placeholder="Empresa"><input id="rPhone" class="input" placeholder="Teléfono / WhatsApp *"><input id="rEmail" class="input" type="email" placeholder="Correo"><input id="rCity" class="input" placeholder="Ciudad"><textarea id="rNotes" class="area" placeholder="Observaciones"></textarea><button id="sendBtn" class="btn primary" onclick="submitRequest()">Enviar solicitud</button><div id="result"></div></div></div></aside>
<section id="productModal" class="modal" role="dialog" aria-modal="true" aria-label="Ficha técnica del producto" onclick="if(event.target===this)closeProduct()"><div class="modal-box"><button class="btn modal-close" aria-label="Cerrar ficha" onclick="closeProduct()">×</button><div id="modalBody"></div></div></section>
<script>
const PROJECT_URL='https://xioqgscjyetsuzrfrrwf.supabase.co',PUBLISHABLE_KEY='sb_publishable_eC3rCOr6eg6NhHWRtYOekw_NayDvsB8',ORG_SLUG='soluciones-epp-store';
const CART_KEY='epp_cart_v21',DRAFT_KEY='epp_request_draft_v21';
const sb=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const readLocal=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key)||'')}catch{return fallback}};
let data={organization:{},products:[]};let cart=Array.isArray(readLocal(CART_KEY,[]))?readLocal(CART_KEY,[]):[];
const formIds=['rName','rCompany','rPhone','rEmail','rCity','rNotes'];
function saveCart(){localStorage.setItem(CART_KEY,JSON.stringify(cart));renderCart()}
function saveDraft(){const draft=Object.fromEntries(formIds.map(id=>[id,document.getElementById(id).value]));localStorage.setItem(DRAFT_KEY,JSON.stringify(draft))}
function hydrateDraft(){const draft=readLocal(DRAFT_KEY,{});formIds.forEach(id=>{const el=document.getElementById(id);el.value=draft[id]||'';el.addEventListener('input',saveDraft)})}
function clearDraft(){localStorage.removeItem(DRAFT_KEY);formIds.forEach(id=>document.getElementById(id).value='')}
function productImages(product){return (product.images||[]).filter(image=>image?.path).sort((a,b)=>Number(a.sort||a.sort_order||0)-Number(b.sort||b.sort_order||0))}
function publicImage(product){const image=productImages(product)[0];return image?.path?sb.storage.from('product-public').getPublicUrl(image.path).data.publicUrl:''}
function publicImagePath(path){return path?sb.storage.from('product-public').getPublicUrl(path).data.publicUrl:''}
function renderCategories(){const select=document.getElementById('categoryFilter'),current=select.value;const categories=[...new Set((data.products||[]).map(p=>p.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));select.innerHTML='<option value="">Todas las categorías</option>'+categories.map(category=>`<option value="${esc(category)}">${esc(category)}</option>`).join('');select.value=categories.includes(current)?current:''}
async function load(){const {data:loaded,error}=await sb.rpc('get_public_catalog',{p_org_slug:ORG_SLUG});if(error){document.getElementById('catalog').innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}data=loaded||data;document.getElementById('brand').textContent=data.organization?.name||'SOLUCIONES EPP STORE';document.getElementById('contact').textContent=[data.organization?.city,data.organization?.phone,data.organization?.email].filter(Boolean).join(' · ');renderCategories();renderProducts();renderCart()}
function renderProducts(){const q=(document.getElementById('search').value||'').toLowerCase();const category=document.getElementById('categoryFilter').value;const list=(data.products||[]).filter(product=>!category||product.category===category).filter(product=>[product.sku,product.name,product.category,product.brand,product.reference,product.short_description].join(' ').toLowerCase().includes(q));document.getElementById('catalog').innerHTML=list.length?list.map(product=>{const image=publicImage(product);return `<article class="card"><button class="ph" aria-label="Ver ficha de ${esc(product.name)}" onclick="openProduct('${product.sku}')">${image?`<img src="${image}" alt="${esc(product.name)}">`:'IMAGEN EN PREPARACIÓN'}</button><div class="body"><div class="cat">${esc(product.category||'EPP')} · ${esc(product.brand||'')}</div><div class="name">${esc(product.name)}</div><div class="desc">${esc(product.short_description||product.technical_description||'')}</div><span class="badge">${esc(product.availability||'Consultar')}</span><div class="actions"><button class="btn" onclick="openProduct('${product.sku}')">Ver ficha</button><button class="btn primary" onclick="addCart('${product.sku}','${encodeURIComponent(product.name)}')">Añadir</button></div></div></article>`}).join(''):'<div class="empty">No se encontraron referencias con ese criterio.</div>'}
function spec(label,value){return value?`<div class="spec"><small>${esc(label)}</small><b>${esc(value)}</b></div>`:''}
function setMainImage(src,button){const image=document.getElementById('mainImage');if(!image)return;image.src=src;document.querySelectorAll('.thumb').forEach(item=>item.classList.remove('active'));button?.classList.add('active')}
function openProduct(sku){const product=(data.products||[]).find(item=>item.sku===sku);if(!product)return;const images=productImages(product);const primary=images[0];const main=primary?publicImagePath(primary.path):'';const features=String(product.features||'').split(/\n|•/).map(item=>item.trim()).filter(Boolean);const details=[spec('Referencia',product.reference),spec('Marca',product.brand),spec('Categoría',product.category),spec('Disponibilidad',product.availability)].filter(Boolean).join('');document.getElementById('modalBody').innerHTML=`<div class="detail"><div><div class="detail-photo">${main?`<img id="mainImage" src="${main}" alt="${esc(product.name)}">`:'Imagen en preparación'}</div>${images.length?`<div class="thumbs">${images.map((image,index)=>{const src=publicImagePath(image.path);return `<button class="thumb ${index===0?'active':''}" onclick="setMainImage('${src}',this)" aria-label="Vista ${index+1} de ${esc(product.name)}"><img src="${src}" alt="${esc(image.alt||product.name)}"></button>`}).join('')}</div>`:''}</div><div><div class="dcat">${esc(product.category||'EPP')} · ${esc(product.brand||'')}</div><h2>${esc(product.name)}</h2><div class="cat">${esc(product.sku)}${product.reference?` · ${esc(product.reference)}`:''}</div><p class="dintro">${esc(product.technical_description||product.short_description||'Información técnica en preparación.')}</p>${details?`<div class="specs">${details}</div>`:''}<div class="actions"><button class="btn primary" onclick="addCart('${product.sku}','${encodeURIComponent(product.name)}')">Añadir al carrito</button><button class="btn" onclick="addCart('${product.sku}','${encodeURIComponent(product.name)}');closeProduct()">Solicitar cotización</button></div>${features.length?`<div class="dsect"><h3>Características principales</h3><div class="features">${features.map(item=>`<div class="feature">${esc(item)}</div>`).join('')}</div></div>`:''}${product.applications?`<div class="dsect"><h3>Aplicaciones recomendadas</h3><div class="info">${esc(product.applications)}</div></div>`:''}${product.recommendations?`<div class="dsect"><h3>Recomendaciones de uso</h3><div class="info">${esc(product.recommendations)}</div></div>`:''}${product.limitations?`<div class="dsect"><h3>Limitaciones y advertencias</h3><div class="warning">${esc(product.limitations)}</div></div>`:''}<p class="technical-note">Ficha técnica comercial basada en la información disponible para esta referencia. Antes de adjudicar, validar requisitos de protección y certificación con la ficha del fabricante.</p></div></div>`;document.getElementById('productModal').classList.add('open');document.body.style.overflow='hidden'}
function closeProduct(){document.getElementById('productModal').classList.remove('open');document.body.style.overflow=''}
function addCart(sku,nameEnc){const name=decodeURIComponent(nameEnc),item=cart.find(entry=>entry.sku===sku);if(item)item.quantity+=1;else cart.push({sku,name,quantity:1,size:'',notes:''});saveCart();openCart()}
function removeItem(sku){cart=cart.filter(item=>item.sku!==sku);saveCart()}
function setQty(sku,value){const item=cart.find(entry=>entry.sku===sku);if(item)item.quantity=Math.max(1,Number(value||1));saveCart()}
function setCartField(sku,field,value){const item=cart.find(entry=>entry.sku===sku);if(item){item[field]=value;saveCart()}}
function renderCart(){const count=cart.reduce((sum,item)=>sum+item.quantity,0);document.getElementById('cartCount').textContent=count;document.getElementById('cartCount2').textContent=count;document.getElementById('cartItems').innerHTML=cart.length?cart.map(item=>`<div class="item"><div><b>${esc(item.name)}</b><small><br>${esc(item.sku)}</small></div><input class="qty" aria-label="Cantidad ${esc(item.name)}" type="number" min="1" value="${item.quantity}" onchange="setQty('${item.sku}',this.value)"><button class="btn" aria-label="Eliminar ${esc(item.name)}" onclick="removeItem('${item.sku}')">×</button><div class="item-detail"><input class="line-input" aria-label="Talla o especificación" placeholder="Talla / especificación" value="${esc(item.size||'')}" oninput="setCartField('${item.sku}','size',this.value)"><textarea class="line-input area" aria-label="Nota para esta referencia" placeholder="Nota para esta referencia" oninput="setCartField('${item.sku}','notes',this.value)">${esc(item.notes||'')}</textarea></div></div>`).join(''):'<div class="empty">Tu carrito está vacío.</div>'}
function openCart(){document.getElementById('drawer').classList.add('open')}function closeCart(){document.getElementById('drawer').classList.remove('open')}
function requestError(message){document.getElementById('result').innerHTML=`<div class="success" style="border-color:#7a3438;background:#35191c;color:#ffd4d6">${esc(message)}</div>`}
async function submitRequest(){if(!cart.length){requestError('Agrega al menos un producto antes de enviar la solicitud.');return}const name=document.getElementById('rName').value.trim(),phone=document.getElementById('rPhone').value.trim();if(!name||!phone){requestError('Nombre y teléfono son obligatorios.');return}if(phone.replace(/\D/g,'').length<7){requestError('Ingresa un teléfono o WhatsApp válido.');return}const button=document.getElementById('sendBtn');button.disabled=true;document.getElementById('result').innerHTML='';const items=cart.map(item=>({sku:item.sku,quantity:item.quantity,size:item.size||'',notes:item.notes||''}));const {data:result,error}=await sb.rpc('submit_public_quote_request',{p_org_slug:ORG_SLUG,p_customer_name:name,p_phone:phone,p_email:document.getElementById('rEmail').value.trim()||null,p_company_name:document.getElementById('rCompany').value.trim()||null,p_city:document.getElementById('rCity').value.trim()||null,p_notes:document.getElementById('rNotes').value.trim()||null,p_items:items});button.disabled=false;if(error){requestError(error.message);return}const number=(Array.isArray(result)?result[0]?.request_number:result?.request_number)||'registrada';document.getElementById('result').innerHTML=`<div class="success">Solicitud <b>${esc(number)}</b> enviada correctamente. Nuestro equipo preparará la cotización.</div>`;cart=[];saveCart();clearDraft()}
hydrateDraft();
load();
</script>
</body>
</html>
